<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala 5</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="contenedorBody">
        <div class="bloqueTexto">
            <h1>Viste al moñeco</h1>
            <p>¡Arrastra la ropa apretando la letra CTRL!</p>
            <form id="formGuardar">
                <input type="text" id="nombrePersonaje" placeholder="Nombre del personaje">
                <button type="submit">Guardar Outfit</button>
            </form>
            <button class="cambioPersonaje">Cambiar moñeco</button>
        </div>

        <div class="bloqueMoñeco" id="contenedorPersonaje">
            <div id="moñecoBase">
                <img src="img/Personaje1.png" id="personaje">

            </div>
        </div>

        <div class="armario">
            <div class="opciones-ropa">
                <img src="img/Top1.png" class="prenda" id="top1" draggable="true">
                <img src="img/Top2.png" class="prenda" id="top2" draggable="true">
                <img src="img/Pantalon1.png" class="prenda" id="pantalon1" draggable="true">
                <img src="img/Pantalon2.png" class="prenda" id="pantalon2" draggable="true">
                <img src="img/Zapato1.png" class="prenda" id="zapato1" draggable="true">
                <img src="img/Zapato2.png" class="prenda" id="zapato2" draggable="true">
            </div>
        </div>
    </div>
    <div id="mensaje"></div>
    <script type="module" src="app.js"></script>
</body>

</html>
